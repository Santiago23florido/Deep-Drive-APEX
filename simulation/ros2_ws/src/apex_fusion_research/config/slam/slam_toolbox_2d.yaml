# slam_toolbox tuning shared by every SLAM instance of the baseline
# (good sensors and damaged sensors), so the instances differ only in their
# inputs. The wildcard key applies it to any slam_toolbox node name; the
# launch file adds the per-instance frames, scan topic and map topic:
#   map_frame  <tag>/map      odom_frame <tag>/odom      base_frame <tag>/base_link
#   scan_topic /apex/fusion/scan_<tag>   map_name /apex/slam/<tag>/map
#
# Values follow the APEX simulation SLAM (rc_sim_description/config/
# slam_toolbox_sim.yaml). Deliberate differences, marked (*):
#   * minimum_travel_distance / heading = 0: the motion prior has zero
#     translation (heading-only IMU prior), so the travel test would never
#     trigger; every scan (throttled by minimum_time_interval) is processed.
#   * enable_interactive_mode false (RViz markers only, no effect on mapping).
/**:
  ros__parameters:
    mode: mapping
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.5
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false       # (*)

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.0         # (*) APEX sim: 0.05
    minimum_travel_heading: 0.0          # (*) APEX sim: 0.05
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 15.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
