# Initial state copied from ground truth, no bias calibration: shows the raw
# effect of every IMU error (turn-on biases included).
fusion_strapdown_ins:
  ros__parameters:
    strapdown:
      gravity_mps2: 9.8
      integration_scheme: trapezoidal
      max_dt_s: 0.5
      clamp_vertical_channel: false
    alignment:
      mode: truth
