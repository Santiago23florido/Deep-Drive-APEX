# Campaign presets and dataset splits.
#
# A *trajectory* is one physical simulation (track, motion profile, seed); a
# *run* is one trajectory seen by one sensor profile. Splits are assigned per
# trajectory and whole tracks, so the windows of one lap can never appear in
# two splits (the generator checks it).
#
#   train       only training tracks, with variation of sensors and speeds;
#               two sensor-motion combinations are held out of train:
#               (C_fast, high) and (B_economic, stop_and_go)
#   validation  the whole val_mixed track (never in train) + the held-out
#               combination (B_economic, stop_and_go) on training tracks
#               with dedicated seeds (new laps)
#   test        the whole test_unseen track (never in train/validation) + the
#               held-out combination (C_fast, high) on training tracks with
#               dedicated seeds
#
# Seeds: odd seeds drive the track counter-clockwise (as designed), even seeds
# clockwise; every seed also changes the start point, lateral offset, driver
# gains, actuator time constants, speed profile, body dynamics and all sensor
# noise realisations.
#
# `role` protects the databases: `main` presets never contain held-out
# (zero-shot) tracks, motions or sensors, and a database created with one
# role refuses runs of the other role.

held_out_combos: &held_out_combos
  - [C_fast, high]
  - [B_economic, stop_and_go]

train_tracks: &train_tracks [oval_asym, technical_s, urban_grid, slalom_cones, boot_lshape]
all_motions: &all_motions [low, medium, high, variable, stop_and_go]
all_sensors: &all_sensors [A_nominal, B_economic, C_fast]

presets:
  smoke:
    role: main
    description: "Short system check: 2 tracks (train + validation), 2 motions, 2 sensor rates, 1 seed, 1 lap."
    laps: 1.0
    groups:
      - {split: train, tracks: [oval_asym], motions: [medium, stop_and_go], sensors: [A_nominal, C_fast], seeds: [1]}
      - {split: validation, tracks: [val_mixed], motions: [medium, stop_and_go], sensors: [A_nominal, C_fast], seeds: [2]}

  full:
    role: main
    description: >-
      Full campaign: 5 training tracks x 5 motions x 6 seeds, validation and
      test tracks x 5 motions x 5 seeds, 3 sensor profiles, 2 laps per run,
      plus the held-out sensor-motion combinations on training tracks.
    laps: 2.0
    groups:
      - {split: train, tracks: *train_tracks, motions: *all_motions, sensors: *all_sensors, seeds: [1, 2, 3, 4, 5, 6], exclude_combos: *held_out_combos}
      - {split: validation, tracks: [val_mixed], motions: *all_motions, sensors: *all_sensors, seeds: [1, 2, 3, 4, 5]}
      - {split: validation, tracks: *train_tracks, motions: [stop_and_go], sensors: [B_economic], seeds: [101, 102]}
      - {split: test, tracks: [test_unseen], motions: *all_motions, sensors: *all_sensors, seeds: [1, 2, 3, 4, 5]}
      - {split: test, tracks: *train_tracks, motions: [high], sensors: [C_fast], seeds: [201, 202]}

  # ------------------------------------------------------------ v2 (real2sim)
  # Gazebo-native sensors of the real APEX hardware (native_runner). Same tracks and splits as v1; fast (fractions
  # of v_ref) and slow (0.3-1.5 m/s) driving. Write it to its own database,
  # e.g. data/multiscenario_pose/pose_dataset_v2.sqlite3.
  smoke_v2:
    role: main
    sensor_backend: gazebo_native
    description: "System check of the native backend: 1 training and 1 validation track, 1 fast and 1 slow motion, 1 seed."
    laps: 1.0
    groups:
      - {split: train, tracks: [oval_asym], motions: [medium, slow_variable], sensors: [APEX_real, APEX_real_compat], seeds: [1]}
      - {split: validation, tracks: [val_mixed], motions: [medium, slow_variable], sensors: [APEX_real, APEX_real_compat], seeds: [2]}

  check_v2:
    role: main
    sensor_backend: gazebo_native
    description: "Quick look at the classical odometry on the real sensors: validation track, fast motions, 1 seed."
    laps: 1.0
    groups:
      - {split: validation, tracks: [val_mixed], motions: [medium, high, slow], sensors: [APEX_real], seeds: [1]}

  full_v2:
    role: main
    sensor_backend: gazebo_native
    description: >-
      Real2sim campaign: 5 training tracks, the validation and test tracks,
      5 fast motions x 6 / 5 seeds (2 laps) and 3 slow motions x 3 seeds
      (1 lap), APEX_real (the A2M8 in its high-speed protocol: the 2 kHz
      compatible protocol of today's car driver is a software defect to fix,
      not a design target; APEX_real_compat stays available).
    laps: 2.0
    groups:
      - {split: train, tracks: *train_tracks, motions: *all_motions, sensors: [APEX_real], seeds: [1, 2, 3, 4, 5, 6]}
      - {split: train, tracks: *train_tracks, motions: [slow, slow_variable, slow_stop_and_go], sensors: [APEX_real], seeds: [1, 2, 3], laps: 1.0}
      - {split: validation, tracks: [val_mixed], motions: *all_motions, sensors: [APEX_real], seeds: [1, 2, 3, 4, 5]}
      - {split: validation, tracks: [val_mixed], motions: [slow, slow_variable, slow_stop_and_go], sensors: [APEX_real], seeds: [1, 2, 3], laps: 1.0}
      - {split: test, tracks: [test_unseen], motions: *all_motions, sensors: [APEX_real], seeds: [1, 2, 3, 4, 5]}
      - {split: test, tracks: [test_unseen], motions: [slow, slow_variable, slow_stop_and_go], sensors: [APEX_real], seeds: [1, 2, 3], laps: 1.0}

  zeroshot:
    role: zeroshot
    description: >-
      Zero-shot evaluation variants, never in the main database (ZERO_SHOT.md).
      Generate them only into a separate file, e.g.
      data/multiscenario_pose/zeroshot_eval.sqlite3.
    laps: 1.0
    groups:
      - {split: test, tracks: [zs_real_track_replica, zs_warehouse_aisles, zs_roundabout_city], motions: [low, medium, variable, stop_and_go], sensors: *all_sensors, seeds: [1, 2]}
      - {split: test, tracks: [val_mixed, test_unseen], motions: [medium, variable], sensors: [ZS_D_dense_270, ZS_E_degraded_offset], seeds: [301]}
      - {split: test, tracks: [test_unseen, boot_lshape], motions: [zs_creep, zs_weave], sensors: [A_nominal, C_fast], seeds: [302]}
      - {split: test, tracks: [test_unseen, oval_asym], motions: [medium, stop_and_go], sensors: [A_nominal], seeds: [303], variant: low_friction, track_overrides: {ground_mu: 0.5}, v_ref_scale: 0.65}
