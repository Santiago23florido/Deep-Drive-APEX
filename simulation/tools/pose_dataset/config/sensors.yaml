        accel: {noise_density: 1.0e-3, turn_on_bias_std: 0.03, bias_instability_std: 3.0e-4, bias_correlation_time_s: 100.0, bias_random_walk: 6.0e-5, scale_factor_std: 0.008, misalignment_std_rad: 0.005, full_scale: 78.45, adc_bits: 16}
