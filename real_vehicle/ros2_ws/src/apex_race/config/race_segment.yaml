# Bounded exploration on the real car's short, approximately 0.9 m wide segment.
# Same SLAM / reactive / adaptive driver; no fixed steering or pre-recorded path.
# Requires an external fresh arm; this file alone does not activate actuators.
# Path length is odometry-based, not an independent physical distance guarantee.
apex_race_driver:
  ros__parameters:
    laps: 3
    vehicle_yaml: ''
    rate_hz: 50.0
    static_start_s: 1.5
    require_arm: true
    arm_timeout_s: 0.5
    max_pose_age_s: 0.3
    max_scan_age_s: 0.6
    scan_stale_s: 0.5
    core_busy_stop_s: 0.25
    imu_rate_hz: 100.0
    lidar_rate_hz: 10.0
    planner_in_process: false
    planner_cpus:
    - 2
    - 3
    vehicle:
      steer_plan_deg: 12.5
      # Nominal PWM equivalents inside the existing 5--10% servo window.
      steer_max_left_deg: 22.5
      steer_max_right_deg: 12.5
      steer_plan_left_deg: 22.5
      steer_plan_right_deg: 12.5
    reactive:
      # Search bicycle arcs directly in this tight low-speed segment. The wall
      # tracker, lane bounds, footprint checks and stopping rule still apply.
      use_wall_planner: false
      preview_while_waiting: false
      n_k1: 21
      n_k2: 11
      w_min_m: 0.9
      d_follow_m: 0.45
      wall_margin_m: 0.15
      c_soft_m: 0.2
      both_max_width_m: 2.0
      wall_min_length_m: 1.2
      wall_min_points: 12
      v_explore_mps: 0.2
      v_min_mps: 0.15
      v_blind_mps: 0.15
      a_lat_mps2: 0.8
      a_acc_mps2: 0.6
      a_dec_mps2: 1.0
      lane_margin_m: 0.25
      local_path_lookahead_m: 0.45
      w_smooth: 0.1  # allow the first turn instead of repeatedly deferring it
    closure:
      arm_distance_m: 6.0
      arm_time_s: 12.0
      overlap_m: 3.0
      lateral_tol_m: 0.8
      return_radius_m: 1.2
    planner:
      bound_erosion_m: 0.1
      none_half_width_m: 0.15
      wall_component_min_m: 1.2
      seam_blend_m: 1.5
    race:
      v_max_mps: 0.2
      a_lat_mps2: 1.2
      a_acc_mps2: 0.6
      a_dec_mps2: 1.2
      v_tight_base_mps: 0.35
      v_tight_gain: 1.5
      handover_max_lat_m: 0.15
      guard_drop_m: 0.12
      finish_margin_m: 0.5
    adaptive:
      # Use the configured wheel authority from startup at this low speed.
      # Keep the measured confidence; do not add the race-speed lookahead here.
      sat_cmd_frac: 1.0
      lookahead_add_m: 0.0
      lookahead_add_s: 0.0
      v_min_update_mps: 0.3
      v_min_steer_mps: 0.45
      slip_arm_v_min_mps: 10.0
      slip_sigma: 1.0e-06
      recover_creep_mps: 0.35
      recover_speed_mps: 0.35
      recover_clearance_m: 0.15
      recover_enabled: false
    mission:
      enabled: true
      max_distance_m: 1.0
      max_duration_s: 5.0
      max_command_mps: 0.40
      forward_only: true
